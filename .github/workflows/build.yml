name: Build Docker Image
on:
  push:
    branches:
      - master
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Setup SSH key        # ← ESTE STEP (ya lo tenías)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/radar_key
          chmod 600 ~/.ssh/radar_key
          ssh-keyscan ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts

      - name: Verify SSH key       # ← AGREGA ESTE NUEVO
        run: |
          echo "=== Key format ==="
          head -1 ~/.ssh/radar_key
          tail -1 ~/.ssh/radar_key
          echo "=== Key validation ==="
          ssh-keygen -l -f ~/.ssh/radar_key

      - name: Create vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i Terraform/ansible/inventory/hosts.ini \
            Terraform/ansible/deploy.yml \
            --vault-password-file ~/.vault_pass
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
