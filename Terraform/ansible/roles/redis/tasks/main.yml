- name: Crear carpeta de data
  file:
    path: /containers/redis/data
    state: directory

- name: Place .env template
  template:
    src: docker-compose.yml.j2
    dest: /containers/redis/docker-compose.yml

- name: Start containers
  community.docker.docker_compose_v2:
    project_src: /containers/redis
    state: present